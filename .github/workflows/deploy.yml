name: Deploy

# Publishes site/ plus data/ to GitHub Pages at health.hgsportafolio.site. It uses the Pages deployment from Actions,
# so the custom domain is a setting of the repository and no file in the build can drop it (the docs site once lost
# its domain that way: a publish replaced every file, the CNAME included). Called by the measuring workflows after
# they commit, and on any change to site/.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/deploy.yml
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish the page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Assemble the page and its data
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r data _site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
